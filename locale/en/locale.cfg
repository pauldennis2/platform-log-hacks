[entity-description]
plh-platform-pilot=Routes the platform via circuit signals. Connect space-location signals on either wire, ordered by value (e.g. Fulgora=1, Nauvis=2, Aquilo=3). Toggle on/off with the switch. Must be placed on a space platform.
plh-platform-request-driver=Sets hub logistic requests from circuit signals. Red wire: item signals + one space-location signal (import source). Stack multiple for different source planets. Must be placed on a space platform.
plh-type-detector=Categorises input item signals by type. Outputs one virtual signal per category with the total item count.
plh-quality-modulator=Applies a quality transformation to all input item signals. Open to select mode.
plh-type-gate=Passes only item signals matching the selected type category. Open to select mode.
plh-subtype-gate=Passes only item signals matching the selected item subgroup (e.g. belt, ammo, module). Open to select.
plh-subtype-spreader=Outputs all items of the selected item subgroup with a count of 1 each. Open to select subgroup.
plh-recipe-reader=Open to select mode. Producer: outputs the building that makes each input item. Ingredients: outputs the crafting ingredients needed to make each input item.
plh-storage-reader=Outputs signal-A (0-100) = % available space in directly-wired storage entities.
plh-spoilage-reader=Outputs signal-S (seconds until most-expiring item expires) and signal-P (% spoiled of most-spoiled item) from directly-wired storage. P calibrates automatically after observing a fresh item of each type. No output if no spoilable items present.

