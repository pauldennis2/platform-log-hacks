[entity-description]
plh-mini-signal-receiver=A compact 2x2 signal receiver. AAI channel UI not yet integrated — avoid opening.
plh-platform-request-driver=Reads circuit signals to set space platform logistics requests. Must be placed on a space platform.
plh-quality-upstepper=Bumps all input item signals up one quality tier.
plh-quality-remover=Strips quality from all input item signals, outputting normal quality.
plh-type-detector=Categorises input item signals by type. Outputs one virtual signal per category with the total item count.
plh-quality-modulator=Applies a quality transformation to all input item signals. Open to select mode.

