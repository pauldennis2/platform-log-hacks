[mod-setting-name]
plh-prd-wait-time=Platform Pilot station wait time (seconds)
plh-circuit-interval=Circuit update interval (ticks)
plh-spoilage-interval=Spoilage reader update interval (ticks)

[mod-setting-description]
plh-prd-wait-time=How long the Platform Pilot holds the platform at each scheduled stop before moving on.
plh-circuit-interval=How often (in game ticks, 60 = 1 second) the mod's circuit combinators update. Lower = more responsive, higher = better UPS. See the mod README for recommendations.
plh-spoilage-interval=How often (in game ticks, 60 = 1 second) the Spoilage Reader scans connected storage. Can be set much higher than the circuit interval without noticeably affecting gameplay. See the mod README for recommendations.

